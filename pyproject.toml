[project]
name = "x-growth-dashboard"
version = "0.0.0"
description = "Local-first X growth dashboard — single-user personal tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "sqlite-utils>=3.36",
    "plotly>=6.7.0",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "vcrpy>=8.1.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Streamlit pages bootstrap sys.path before they can import app.*, so the
# E402 (module-level imports must be at top) check has to be relaxed for
# these files. The shim is documented in app/main.py and each page header.
"app/main.py" = ["E402"]
"app/pages/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
